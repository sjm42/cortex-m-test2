# Cargo.toml

[package]
authors = ["Sami J. Mäkinen <sjm@iki.fi>"]
edition = "2024"
readme = "README.md"
name = "cortex-m-test2"
version = "1.0.0"


[features]
stm32f103 = []
stm32f401 = ["stm32f4xx-hal/stm32f401"]
stm32f411 = ["stm32f4xx-hal/stm32f411"]
nrf52840 = []

default = ["blue_pill"]
# default = ["black_pill"]
# default = ["black_pill_f401"]
# default = ["nucleo_f411"]
# default = ["nrf52840_dk"]
# default = ["nrf52840_dongle"]
# default = ["nrf52840_dongle_sd"]


blue_pill = ["stm32f103", "stm32f1xx-hal"]
black_pill = ["stm32f411", "stm32f4xx-hal"]
black_pill_f401 = ["stm32f401", "stm32f4xx-hal"]
nucleo_f411 = ["stm32f411", "stm32f4xx-hal"]
nrf52840_dk = ["nrf52840", "nrf52840-hal"]
nrf52840_dongle = ["nrf52840", "nrf52840-hal"]
nrf52840_dongle_sd = ["nrf52840", "nrf52840-hal"]


[dependencies.stm32f1xx-hal]
optional = true
version = "0.11"
features = ["stm32f103"]

[dependencies.stm32f4xx-hal]
optional = true
version = "0.23"

[dependencies.nrf52840-hal]
optional = true
version = "0.19"
default-features = false
features = ["rt"]


[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "1.0"
panic-halt = "1.0"


# this lets you use `cargo fix`!
[[bin]]
name = "cortex-m-test2"
test = false
bench = false


[profile.release]
opt-level = 'z'
codegen-units = 1 # better optimizations
debug = true      # symbols are nice and they don't increase the size on Flash
lto = true        # better optimizations

# EOF
